name: Server Deploy

on:
  push:
    tags:
      - "server-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy'
        required: true
        type: string

jobs:
  build-and-test:
    name: Build and Test Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: medusa_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: ./server/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build application
        run: yarn run build

      - name: Run unit tests
        run: yarn run test:unit
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/medusa_test

      - name: Run integration tests (modules)
        run: yarn run test:integration:modules
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/medusa_test

      - name: Run integration tests (HTTP)
        run: yarn run test:integration:http
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/medusa_test

  deploy:
    name: Deploy Server to Fly.io
    runs-on: ubuntu-latest
    needs: build-and-test
    defaults:
      run:
        working-directory: ./server
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --app cellthium
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Post-deployment health check
        run: |
          echo "Waiting for deployment to be ready..."
          sleep 60
          curl -f https://cellthium.fly.dev/health || echo "Health check failed, but deployment may still be in progress"
