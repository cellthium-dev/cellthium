name: Full Stack Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy'
        required: true
        type: string

jobs:
  build-client:
    name: Build and Test Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Build application
        run: npm run build

  build-server:
    name: Build and Test Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: medusa_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/medusa_test

      - name: Run integration tests (modules)
        run: npm run test:integration:modules
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/medusa_test

      - name: Run integration tests (HTTP)
        run: npm run test:integration:http
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/medusa_test

  deploy-server:
    name: Deploy Server to Fly.io
    runs-on: ubuntu-latest
    needs: build-server
    defaults:
      run:
        working-directory: ./server
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --app cellthium
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-client:
    name: Deploy Client to Fly.io
    runs-on: ubuntu-latest
    needs: [build-client, deploy-server]  # Deploy client after server is ready
    defaults:
      run:
        working-directory: ./client
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --app cellthium-app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  health-check:
    name: Post-deployment Health Check
    runs-on: ubuntu-latest
    needs: [deploy-server, deploy-client]
    
    steps:
      - name: Wait for deployments
        run: |
          echo "Waiting for deployments to be ready..."
          sleep 60

      - name: Check server health
        run: |
          curl -f https://cellthium.fly.dev/health || echo "Server health check failed, but deployment may still be in progress"

      - name: Check client health
        run: |
          curl -f https://cellthium-app.fly.dev/ || echo "Client health check failed, but deployment may still be in progress"

      - name: Deployment summary
        run: |
          echo "🚀 Deployment completed!"
          echo "📱 Client: https://cellthium-app.fly.dev/"
          echo "🖥️  Server: https://cellthium.fly.dev/"
