name: Server CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'

jobs:
  build-and-test:
    name: Build and Test Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: medusa_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build application
        run: yarn run build

      - name: Run unit tests
        run: yarn run test:unit
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/medusa_test

      - name: Run integration tests (modules)
        run: yarn run test:integration:modules
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/medusa_test

      - name: Run integration tests (HTTP)
        run: yarn run test:integration:http
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/medusa_test

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ./server/dist
            ./server/node_modules
          key: server-build-${{ github.sha }}
